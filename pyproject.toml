[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "maxcal"
version = "0.2.0"
description = "Maximum-caliber correction of underestimated barriers in first-passage trajectories (two-state kinetics, TSE)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7", "nbformat", "nbclient", "ipykernel"]
demo = ["jupyterlab", "ipywidgets>=8"]

[project.scripts]
maxcal-stitch = "maxcal.stitching:main"
maxcal-reweight = "maxcal.reweight:main"
maxcal-committor = "maxcal.committor:main"
maxcal-joint = "maxcal.joint:main"
maxcal-target = "maxcal.target:main"

[tool.setuptools]
packages = ["maxcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
